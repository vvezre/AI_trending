name: Keep Scheduled Workflows Active

on:
  schedule:
    # Weekly at 09:00 Beijing time, Monday.
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create keepalive commit when repository is close to inactivity limit
        shell: bash
        run: |
          set -euo pipefail

          threshold_days=45
          last_commit_ts="$(git log -1 --format=%ct)"
          now_ts="$(date +%s)"
          age_days="$(( (now_ts - last_commit_ts) / 86400 ))"

          echo "Last commit age: ${age_days} days"
          echo "Keepalive threshold: ${threshold_days} days"

          if [ "${age_days}" -lt "${threshold_days}" ]; then
            echo "Repository is active enough; no keepalive commit needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep scheduled workflows active"
          git push
